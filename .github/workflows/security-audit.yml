name: Security & Hygiene

# ALICE-Auth を base に ALICE-API 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し
# - 仮実装 (panic!(STUB) / dbg!) の CI gate (todo!/unimplemented! は informational)

on:
  # every event is looked at; the `changes` job decides which jobs run (a path filter
  # sees nothing on the first event of a new ci/ branch, so the diff is taken against
  # the merge base with main there)
  push:
    branches: [main, 'ci/**']
  schedule:
    # weekly on a fresh resolve (no Cargo.lock is committed), so a new advisory goes red
    # without a change here; each ALICE repo has its own slot
    - cron: '17 3 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  changes:
    name: changed paths
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = refs/heads/main ] && [ -n "${BEFORE}" ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ]; then
            base="${BEFORE}"
          else
            git fetch -q origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          files="$(git diff --name-only "${base}" HEAD)"
          echo "base ${base}"; printf '%s\n' "${files}"
          deps=false; code=false
          if printf '%s\n' "${files}" | grep -Eq '^(Cargo\.toml|Cargo\.lock|deny\.toml|\.github/workflows/security-audit\.yml|\.github/actions/|scripts/(test_)?deny_graph_guard\.py)'; then deps=true; fi
          if [ "${deps}" = true ] || printf '%s\n' "${files}" | grep -Eq '^(src/|bindings/|crates/)'; then code=true; fi
          echo "deps=${deps}" >> "${GITHUB_OUTPUT}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  audit:
    name: cargo audit (RustSec CVE scan)
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # fresh resolve (no Cargo.lock is committed); the scan must cover a nonzero number of
      # crates, else it compared nothing
      - name: Resolve
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo generate-lockfile
          n=$(grep -c '^name = ' Cargo.lock)
          echo "resolved ${n} packages"
          # every ALICE crate the manifest takes by git rev is in the resolve
          pinned=0
          while read -r name; do
            pinned=$((pinned + 1))
            grep -q "^name = \"${name}\"" Cargo.lock || { echo "::error::${name} is not in the resolve"; exit 1; }
          done < <(grep -oE '^alice-[a-z0-9-]+ = \{ git = ' Cargo.toml | cut -d' ' -f1)
          [ "${pinned}" -gt 0 ] || { echo "::error::Cargo.toml takes no alice-* crate by git"; exit 1; }
          [ "${n}" -gt 1 ] || { echo "::error::resolved ${n} packages"; exit 1; }

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny、unmaintained warning は個別 ignore で管理
      # deny.toml と同期
      - name: Run cargo audit
        run: |
          set -o pipefail
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0020 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2026-0192 2>&1 | tee audit.log
          n=$(grep -oE 'vulnerabilities \([0-9]+ crate dependencies\)' audit.log | grep -oE '[0-9]+' | head -1)
          [ "${n:-0}" -gt 0 ] || { echo "::error::cargo audit scanned ${n:-0} crates"; exit 1; }
          echo "cargo audit scanned ${n} crates"

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # 直接 install で回避
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      # fresh resolve, then the check; cargo deny's crate graph must hold this crate and every
      # pinned sibling and be no larger than the resolve, else the check compared nothing
      # (scripts/deny_graph_guard.py, its tests first)
      - name: Run cargo deny check all
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo generate-lockfile
          python3 scripts/test_deny_graph_guard.py
          cargo deny --all-features list --format json --layout crate > deny-graph.json
          python3 scripts/deny_graph_guard.py --graph deny-graph.json --lock Cargo.lock \
            --manifest Cargo.toml --crate alice-api
          cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 「仮実装完了偽装の禁止ルール」準拠
      - name: Block panic!(STUB) in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'panic!\([^)]*STUB' src/ --include="*.rs" --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' | grep -vE ':[[:space:]]*/\*' || true)
          if [ -n "$hits" ]; then echo "❌"; echo "$hits"; exit 1; fi
          echo "✓ No panic!(STUB) in src/"

      - name: Detect todo! / unimplemented! (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'todo!\(|unimplemented!\(' src/ --include="*.rs" --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' | grep -vE ':[[:space:]]*/\*' || true)
          if [ -n "$hits" ]; then
            count=$(echo "$hits" | wc -l | tr -d ' ')
            echo "::warning::${count} todo!()/unimplemented!() marker(s) (informational, legitimate fail-fast idiom)"
          fi

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then echo "❌"; echo "$hits"; exit 1; fi
          echo "✓ No dbg!() in src/"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  coverage:
    name: Coverage (cargo-llvm-cov、informational)
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --lib --summary-only 2>&1 | tee coverage-summary.txt

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compat、informational)
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    # ALICE-API は publish = false (private crate) のため crates.io baseline なし
    # git baseline (main~1) で比較、informational only
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # baseline-rev 比較のため full history 必要
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # version 明示 pin: `@latest` は rustc MSRV を追いかける (0.50.0 = 1.93+) ので、
      # rust-toolchain.toml の pin が遅れると赤になる (2026-09-14 事案) toolchain と
      # 一緒に月次で bump する
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # publish=false のため --baseline-rev で git 経由の比較
      # main の直前 commit と比較 (informational、break あっても block しない)
      - name: Run cargo semver-checks
        run: |
          cargo semver-checks check-release \
            --package alice-api \
            --baseline-rev "HEAD~1" \
            || true
