name: 'ALICE-API Sibling Checkout'
description: |
  Check out the real ALICE-* siblings that alice-api's optional bridge features
  (`auth` / `crypto` / `secure` / `queue` / `analytics`) reference through
  workspace-relative path deps, each at the commit pinned in `.github/alice-siblings`,
  next to this checkout (`$GITHUB_WORKSPACE/../ALICE-X`, where the path deps point).
  Used by the build and test jobs and by the advisory scan, so a dependency that
  enters through a sibling (and the advisories against it) is resolved for real,
  never through an empty stub.

  The pin file is read line by line (`<Repo> <40-hex SHA>`, `#` comments). A malformed
  line, an empty file, or a checkout that does not land on the pinned commit fails.

runs:
  using: composite
  steps:
    - name: Check out the pinned siblings
      shell: bash
      run: |
        set -euo pipefail
        parent="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
        pins="${GITHUB_WORKSPACE}/.github/alice-siblings"
        count=0
        while read -r repo sha rest; do
          case "${repo}" in ''|'#'*) continue ;; esac
          if [ -n "${rest}" ] || ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::malformed pin line: ${repo} ${sha} ${rest}"
            exit 1
          fi
          rm -rf "${parent:?}/${repo}"
          git init -q "${parent}/${repo}"
          git -C "${parent}/${repo}" fetch -q --depth 1 "https://github.com/ext-sakamoro/${repo}.git" "${sha}"
          git -C "${parent}/${repo}" checkout -q --detach FETCH_HEAD
          got="$(git -C "${parent}/${repo}" rev-parse HEAD)"
          if [ "${got}" != "${sha}" ]; then
            echo "::error::${repo} is at ${got}, the pin says ${sha}"
            exit 1
          fi
          echo "${repo} $(grep -m1 '^version' "${parent}/${repo}/Cargo.toml") @ ${sha}"
          count=$((count + 1))
        done < "${pins}"
        if [ "${count}" -eq 0 ]; then
          echo "::error::no sibling pinned in .github/alice-siblings"
          exit 1
        fi
        echo "checked out ${count} pinned siblings"
