[package]
name = "alice-api"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "High-performance API Gateway with Distributed Rate Limiting and Zero-Copy Routing"
license = "LicenseRef-Proprietary"
repository = "https://github.com/anthropics/alice-api"
keywords = ["api-gateway", "rate-limiting", "gcra", "zero-copy"]
categories = ["network-programming", "web-programming"]
publish = false

[features]
default = ["std"]
std = ["dep:libc"]  # routing (splice / sendfile) は libc 依存、no_std では http parsing のみ
ffi = ["std"]     # C/C++/C# FFI bindings
auth = ["dep:alice-auth"]
crypto = ["dep:alice-crypto"]
secure = ["auth", "crypto"]
queue = ["dep:alice-queue", "std"]          # ALICE-Queue message queueing
analytics = ["dep:alice-analytics", "std"]  # ALICE-Analytics API metrics

[dependencies]
# Logging
log = "0.4"
# For zero-copy syscalls (splice, sendfile) — routing module (std 専用) のみ
libc = { version = "0.2", optional = true }
# Optional: Ed25519 ZKP authentication
alice-auth = { git = "https://github.com/ext-sakamoro/ALICE-Auth", branch = "main", version = "0.6.0", optional = true, default-features = false, features = ["std"] }
# Optional: XChaCha20-Poly1305 encryption
alice-crypto = { git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main", version = "0.7.0", optional = true, default-features = false, features = ["std"] }
# Optional: Message queueing
alice-queue = { git = "https://github.com/ext-sakamoro/ALICE-Queue", branch = "main", version = "0.2.0", optional = true }
# Optional: API metrics collection
alice-analytics = { git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", version = "0.7.0", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.5"

[package.metadata.cargo-machete]
# `log` is used as an optional facade for downstream consumers (FFI callers)
# even when no log macros are invoked directly in src/. Kept for API surface.
ignored = ["log"]

[[bench]]
name = "api_bench"
harness = false

[[example]]
name = "rate_limiter"

[[example]]
name = "fair_queue"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
