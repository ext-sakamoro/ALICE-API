# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-Auth の deny.toml を base に ALICE-API 用に調整
#
# ALICE-API 自体は AGPL-3.0 だが、target crate なので self-exception で許可
# sibling stubs (alice-auth / alice-crypto / alice-queue / alice-analytics) は
# alice-stubs action で "MIT OR Apache-2.0" で生成される (canonical 罠 #2 予防)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0436",  # paste unmaintained
    "RUSTSEC-2025-0141",  # bincode 1.x unmaintained
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained
    "RUSTSEC-2026-0204",  # crossbeam-epoch (safety keep, should be fixed by cargo update)
    "RUSTSEC-2025-0020",  # pyo3 PyString::from_object buffer overflow (transitive)
    "RUSTSEC-2026-0176",  # pyo3 nth/nth_back OOB (0.29 で fix)
    "RUSTSEC-2026-0177",  # pyo3 PyCFunction::new_closure Sync 欠落 (0.29 で fix)
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ALICE-API 自身 (target crate) が AGPL-3.0 だが cargo-deny は target も
# license check 対象にするため exception で自己許可
# (canonical [[reference_alice_ci_canonical_template]] 罠 #7)
[[licenses.exceptions]]
name = "alice-api"
allow = ["AGPL-3.0", "AGPL-3.0-only"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
